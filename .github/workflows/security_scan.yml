name: "🔒 Security & Compliance Vulnerability Scan"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    # Run once a week on Sundays at midnight to catch newly discovered CVEs
    - cron: '0 0 * * 0'

permissions:
  contents: read
  security-events: write

jobs:
  sast_scan:
    name: "Semgrep Static Analysis (SAST)"
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep

      - name: Run Semgrep SAST Rules
        run: |
          # Run Semgrep with standard security rules for Python (FastAPI) and TypeScript (Next.js)
          semgrep scan --config=auto --error

  api_spec_validation:
    name: "OpenAPI Specification & DAST Linting"
    runs-on: ubuntu-latest
    needs: sast_scan
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify OpenAPI Spec Exists
        run: |
          if [ ! -f docs/openapi.json ]; then
            echo "❌ ERROR: docs/openapi.json is missing! Please run 'python scripts/generate_openapi.py' locally and commit the spec file."
            exit 1
          else
            echo "✅ docs/openapi.json found!"
          fi

      - name: Lint OpenAPI Spec for Security Gaps
        run: |
          python -m pip install --upgrade pip
          pip install openapi-spec-validator
          openapi-spec-validator docs/openapi.json
