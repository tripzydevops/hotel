name: CI — Tests & Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-test:
    name: Run Frontend Tests & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm test

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://ci-dummy.insforge.app"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-dummy-anon-key"

      - name: Install Playwright Browsers & Dependencies
        run: npx --yes playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        run: npm run test:e2e
        env:
          CI: true
          SESSION_SECRET: "ci-dummy-session-secret-at-least-32-chars-long"
          NEXT_PUBLIC_SUPABASE_URL: "https://ci-dummy.insforge.app"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-dummy-anon-key"

  backend-test:
    name: Run pytest suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run pytest
        env:
          # Dummy env vars so backend modules can import without crashing.
          # Tests that need real API calls use mocks — these are placeholders only.
          GOOGLE_API_KEY: "ci-dummy-key"
          GEMINI_API_KEY: "ci-dummy-key"
          NEXT_PUBLIC_SUPABASE_URL: "https://ci-dummy.insforge.app"
          SUPABASE_SERVICE_ROLE_KEY: "ci-dummy-service-key"
          DATAFORSEO_LOGIN: "ci-dummy"
          DATAFORSEO_PASSWORD: "ci-dummy"
          DATAFORSEO_POSTBACK_URL: "https://ci-dummy.vercel.app/api/v1/webhooks/dataforseo"
          SERPAPI_API_KEY: "ci-dummy"
          FIRECRAWL_API_KEY: "ci-dummy"
          VAPID_SUBJECT: "mailto:ci@dummy.com"
          VAPID_PRIVATE_KEY: "ci-dummy"
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: "ci-dummy"
        run: |
          python -m pytest

      - name: Run Pyright Type Checks on Core Services
        run: npx --yes pyright backend/services/dashboard_service.py

      - name: 🚫 Ban deprecated google.generativeai SDK
        # Fails the build if anyone re-introduces the deprecated package.
        # Use 'from google import genai' (google-genai) instead.
        run: |
          if grep -r "import google.generativeai" backend/ --include="*.py" -l; then
            echo ""
            echo "❌ DEPRECATED SDK DETECTED"
            echo "   'google.generativeai' is fully deprecated and no longer receives updates."
            echo "   Replace with: 'from google import genai' (google-genai package)."
            echo "   See: https://github.com/google-gemini/deprecated-generative-ai-python"
            exit 1
          fi
          echo "✅ No deprecated google.generativeai imports found."

      - name: 🧹 Enforce Root Hygiene (No loose root scripts)
        run: |
          if ls -1 *.py 2>/dev/null; then
            echo ""
            echo "❌ ROOT HYGIENE VIOLATION"
            echo "   Loose Python scripts are forbidden at the repository root."
            echo "   Please move operational scripts into scripts/ or scripts/maintenance/."
            exit 1
          fi
          echo "✅ Root directory is clean of loose maintenance scripts."

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: .pytest_cache/
          retention-days: 7
